name: NanoImage syntax

on:
  pull_request:
    paths:
      - 'images/windows-core/**'
      - 'provisioning/windows/base/**'
      - 'benchmarks/protocol/**'
      - '.github/workflows/image-syntax.yml'
  push:
    branches: [main]
    paths:
      - 'images/windows-core/**'
      - 'provisioning/windows/base/**'
      - 'benchmarks/protocol/**'
      - '.github/workflows/image-syntax.yml'

permissions:
  contents: read

jobs:
  parse:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @('images/windows-core/New-NanoADBase.ps1', 'provisioning/windows/base/Inspect-NanoADBase.ps1', 'benchmarks/protocol/probe-windows.ps1')
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { $errors | Format-List; throw "Syntax error in $path" }
            Write-Host "Parsed $path"
          }
      - name: Parse with PowerShell 7
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @('images/windows-core/New-NanoADBase.ps1', 'provisioning/windows/base/Inspect-NanoADBase.ps1', 'benchmarks/protocol/probe-windows.ps1')
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { $errors | Format-List; throw "Syntax error in $path" }
            Write-Host "Parsed $path"
          }
