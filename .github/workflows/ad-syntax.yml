name: NanoCore syntax and identity

on:
  pull_request:
    paths:
      - 'provisioning/windows/ad-core/**'
      - 'tests/integration/ad/**'
      - '.github/workflows/ad-syntax.yml'
  push:
    branches: [main]
    paths:
      - 'provisioning/windows/ad-core/**'
      - 'tests/integration/ad/**'
      - '.github/workflows/ad-syntax.yml'

permissions:
  contents: read

jobs:
  parse:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Parse and test identity on Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem provisioning/windows/ad-core,tests/integration/ad -Filter *.ps1 -File)
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count -gt 0) { $errors | Format-List; throw "Syntax error: $($file.Name)" }
          }
          & ./tests/integration/ad/Test-Identity.ps1
      - name: Parse and test identity on PowerShell 7
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem provisioning/windows/ad-core,tests/integration/ad -Filter *.ps1 -File)
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count -gt 0) { $errors | Format-List; throw "Syntax error: $($file.Name)" }
          }
          & ./tests/integration/ad/Test-Identity.ps1
