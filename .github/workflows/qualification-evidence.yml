name: Qualification evidence checks

on:
  pull_request:
    paths:
      - 'tests/integration/qualification/**'
      - 'benchmarks/results/qualification-template.json'
      - '.github/workflows/qualification-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'tests/integration/qualification/**'
      - 'benchmarks/results/qualification-template.json'
      - '.github/workflows/qualification-evidence.yml'

permissions:
  contents: read

jobs:
  evidence:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Parse and run synthetic evidence tests on Windows PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in Get-ChildItem tests/integration/qualification -Filter *.ps1 -File) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count -gt 0) { $errors | Format-List; throw 'Qualification syntax failure' }
          }
          & ./tests/integration/qualification/Test-Qualification.ps1
      - name: Parse and run synthetic evidence tests on PowerShell 7
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in Get-ChildItem tests/integration/qualification -Filter *.ps1 -File) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count -gt 0) { $errors | Format-List; throw 'Qualification syntax failure' }
          }
          & ./tests/integration/qualification/Test-Qualification.ps1
